<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>zland · trail cam</title>
<style>
  :root {
    --bg: #0e0f12;
    --panel: #16181d;
    --border: #262a32;
    --text: #e7e9ee;
    --muted: #8b909c;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(14,15,18,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
    padding: 14px 20px;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.5px; }
  header .count { color: var(--muted); font-size: 13px; }
  main { padding: 0 16px 80px; }
  .date-header {
    position: sticky; top: 49px; z-index: 5;
    background: rgba(14,15,18,0.92); backdrop-filter: blur(8px);
    color: var(--accent); font-size: 13px; font-weight: 600;
    padding: 14px 4px 8px; margin: 0;
    border-bottom: 1px solid var(--border);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 6px;
    padding: 8px 0 4px;
  }
  .cell {
    aspect-ratio: 4 / 3; overflow: hidden; border-radius: 6px;
    background: var(--panel); border: 1px solid var(--border);
    cursor: pointer; position: relative;
  }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transition: opacity 0.25s; }
  .cell img.loaded { opacity: 1; }
  .cell .time {
    position: absolute; left: 6px; bottom: 6px;
    font-size: 11px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    pointer-events: none;
  }
  #sentinel { height: 60px; }
  #loading { text-align: center; color: var(--muted); font-size: 13px; padding: 20px; }

  /* Lightbox */
  #lb { position: fixed; inset: 0; z-index: 100; display: none;
    background: rgba(0,0,0,0.94); }
  #lb.open { display: flex; align-items: center; justify-content: center; }
  #lb img { max-width: 96vw; max-height: 88vh; object-fit: contain; }
  #lb .meta { position: absolute; top: 16px; left: 0; right: 0; text-align: center;
    color: var(--text); font-size: 14px; }
  #lb .nav { position: absolute; top: 0; bottom: 0; width: 22%;
    display: flex; align-items: center; cursor: pointer; user-select: none;
    color: #fff; font-size: 40px; opacity: 0.5; transition: opacity 0.15s; }
  #lb .nav:hover { opacity: 1; }
  #lb .prev { left: 0; justify-content: flex-start; padding-left: 24px; }
  #lb .next { right: 0; justify-content: flex-end; padding-right: 24px; }
  #lb .close { position: absolute; top: 12px; right: 18px; z-index: 10; color: #fff;
    font-size: 30px; cursor: pointer; opacity: 0.6; line-height: 1; padding: 4px 8px; }
  #lb .close:hover { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>zland · trail cam</h1>
  <span class="count" id="count">loading…</span>
</header>
<main id="main"></main>
<div id="loading">loading…</div>
<div id="sentinel"></div>

<div id="lb">
  <span class="close" id="lbClose">&times;</span>
  <div class="meta" id="lbMeta"></div>
  <div class="nav prev" id="lbPrev">&#8249;</div>
  <img id="lbImg" alt="" />
  <div class="nav next" id="lbNext">&#8250;</div>
</div>

<script>
(function () {
  var images = [];          // newest-first filenames
  var rendered = 0;         // how many we've placed in the DOM
  var BATCH = 120;
  var lastDate = null;
  var currentGrid = null;
  var main = document.getElementById('main');

  // 2023-08-08@01:30:00.jpg -> { date: '2023-08-08', time: '01:30:00' }
  function parse(name) {
    var at = name.indexOf('@');
    var date = at > -1 ? name.slice(0, at) : name;
    var time = at > -1 ? name.slice(at + 1).replace('.jpg', '') : '';
    return { date: date, time: time };
  }

  function fmtDate(d) {
    var parts = d.split('-');
    if (parts.length !== 3) return d;
    var dt = new Date(parts[0], parts[1] - 1, parts[2]);
    return dt.toLocaleDateString(undefined,
      { weekday: 'short', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function renderBatch() {
    var end = Math.min(rendered + BATCH, images.length);
    for (var i = rendered; i < end; i++) {
      var name = images[i];
      var p = parse(name);
      if (p.date !== lastDate) {
        lastDate = p.date;
        var h = document.createElement('h2');
        h.className = 'date-header';
        h.textContent = fmtDate(p.date);
        main.appendChild(h);
        currentGrid = document.createElement('div');
        currentGrid.className = 'grid';
        main.appendChild(currentGrid);
      }
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;
      var img = document.createElement('img');
      img.loading = 'lazy';
      img.src = '/img/' + encodeURIComponent(name);
      img.onload = function () { this.classList.add('loaded'); };
      var t = document.createElement('span');
      t.className = 'time';
      t.textContent = p.time;
      cell.appendChild(img);
      cell.appendChild(t);
      cell.addEventListener('click', openLightbox);
      currentGrid.appendChild(cell);
    }
    rendered = end;
    if (rendered >= images.length) {
      document.getElementById('loading').style.display = 'none';
      observer.disconnect();
    }
  }

  var observer = new IntersectionObserver(function (entries) {
    if (entries[0].isIntersecting && rendered < images.length) renderBatch();
  }, { rootMargin: '600px' });
  observer.observe(document.getElementById('sentinel'));

  // ---- Lightbox ----
  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lbImg');
  var lbMeta = document.getElementById('lbMeta');
  var lbIndex = -1;

  function showLightbox(i) {
    if (i < 0 || i >= images.length) return;
    lbIndex = i;
    var name = images[i];
    var p = parse(name);
    lbImg.src = '/img/' + encodeURIComponent(name);
    lbMeta.textContent = fmtDate(p.date) + '  ·  ' + p.time +
      '   (' + (i + 1).toLocaleString() + ' / ' + images.length.toLocaleString() + ')';
    lb.classList.add('open');
  }
  function openLightbox() { showLightbox(parseInt(this.dataset.index, 10)); }
  function closeLightbox() {
    lb.classList.remove('open'); lbImg.src = '';
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  }

  // Deep link: /#<filename> opens that image's lightbox over the grid, so an
  // external link (e.g. the brainya launcher) lands on a page with chrome
  // rather than the bare image file.
  function openFromHash() {
    var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (!h) return;
    var idx = images.indexOf(h);
    if (idx > -1) showLightbox(idx);
  }
  window.addEventListener('hashchange', openFromHash);

  // Images are newest-first (lower index = newer). Right goes BACK in time
  // (older = higher index); left goes forward (newer = lower index).
  document.getElementById('lbPrev').addEventListener('click', function () { showLightbox(lbIndex - 1); });
  document.getElementById('lbNext').addEventListener('click', function () { showLightbox(lbIndex + 1); });
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  lb.addEventListener('click', function (e) { if (e.target === lb) closeLightbox(); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') showLightbox(lbIndex - 1);
    else if (e.key === 'ArrowRight') showLightbox(lbIndex + 1);
  });

  // ---- Boot ----
  fetch('/api/images').then(function (r) { return r.json(); }).then(function (data) {
    images = data.images || [];
    document.getElementById('count').textContent = images.length.toLocaleString() + ' images';
    if (!images.length) {
      document.getElementById('loading').textContent = 'No images yet.';
      return;
    }
    renderBatch();
    openFromHash();
  }).catch(function (err) {
    document.getElementById('loading').textContent = 'Failed to load: ' + err.message;
  });
})();
</script>
</body>
</html>
